name: macprovider fork build

# Compile check for macprovider/* fork branches before any lab-hardware time: the upstream
# workflows only run in ml-explore/mlx-swift-lm. Builds library and test targets and runs the
# CPU-only speculative-round tests; Metal tests and real-model runs stay on lab hardware.
on:
  push:
    branches: ["macprovider/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macprovider-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Augustas11/mlx-swift-lm'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build library and test targets
        run: swift build --build-tests 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80
      # CPU-only logic tests (tiny random models, no Metal): speculative verify and rollback
      # must reproduce ordinary decode exactly.
      - name: CPU speculative-round tests
        run: |
          swift test --skip-build --filter "Inkling2SpeculativeRoundTests|ConvolutionTailRound|KVCacheRoundTests" 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
