name: macprovider fork build

# Compile check for macprovider/* fork branches before any lab-hardware time: the upstream
# workflows only run in ml-explore/mlx-swift-lm. Builds library and test targets and runs the
# CPU-only speculative-round tests; Metal tests and real-model runs stay on lab hardware.
on:
  push:
    branches: ["macprovider/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macprovider-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Augustas11/mlx-swift-lm'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build library and test targets
        run: swift build --build-tests 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80
      # Loading the test bundle initialises MLX's Metal backend, which needs mlx.metallib even
      # for CPU-only tests: build it from the resolved mlx-swift checkout.
      - name: Build mlx.metallib
        run: |
          xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 || true
          curl -fsSL https://raw.githubusercontent.com/Augustas11/macprovider/main/phase3-binary/scripts/build-mlx-metallib.sh -o "$RUNNER_TEMP/build-mlx-metallib.sh"
          MLX_SWIFT_CHECKOUT="$PWD/.build/checkouts/mlx-swift" bash "$RUNNER_TEMP/build-mlx-metallib.sh" "$RUNNER_TEMP/metallib"
          for x in .build/arm64-apple-macosx/debug/*.xctest/Contents/MacOS; do cp "$RUNNER_TEMP/metallib/mlx.metallib" "$x/"; done
          cp "$RUNNER_TEMP/metallib/mlx.metallib" .build/arm64-apple-macosx/debug/
      # CPU-only logic tests (tiny random models): speculative verify and rollback must
      # reproduce ordinary decode exactly.
      - name: CPU speculative-round tests
        run: |
          swift test --skip-build --filter "Inkling2SpeculativeRoundTests|ConvolutionTailRound|KVCacheRoundTests" 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      # The runner's paravirtual GPU: every verify row must equal its one-row decode step bit
      # for bit, in the toy-width model and at Inkling 2 Mini's real widths. The second run
      # forces one two-pass block count so the folded attention also runs MLX's two-pass kernel
      # here (this GPU otherwise routes long-key folds to the per-row calls).
      - name: GPU verify bit-exactness (hosted GPU)
        run: |
          INKLING2_GPU_TESTS=1 swift test --skip-build --filter "Inkling2SpeculativeRoundTests/testVerifyRows|Inkling2VerifyKernelTests" 2>&1 | tee gpu-test.log
          rc=${PIPESTATUS[0]}
          MLX_SDPA_BLOCKS=64 INKLING2_GPU_TESTS=1 swift test --skip-build --filter "Inkling2VerifyKernelTests/testFoldedVerifyAttention" 2>&1 | tee gpu-test-2pass.log
          rc2=${PIPESTATUS[0]}
          grep -h "INKLING2_VERIFY_FOLDS" gpu-test.log gpu-test-2pass.log || true
          [ "$rc" = 0 ] && [ "$rc2" = 0 ]
